<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#264c3d">
  <meta name="description" content="산책하고 읽고 배우며, 제주에서 내 이름의 책 한 권을 준비하는 공간">
  <title>제주 한 권 — 나를 만나는 사계절</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="styles.css"><script src="places.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#today"><span class="brand-mark" aria-hidden="true">冊</span><span>제주 한 권<small>나를 만나는 사계절</small></span></a>
    <p class="nav-label">나의 제주 생활</p>
    <nav aria-label="주 메뉴">
      <a href="#today" data-page="today"><span aria-hidden="true">☀</span>오늘</a>
      <a href="#walk" data-page="walk"><span aria-hidden="true">♧</span>산책</a>
      <a href="#learn" data-page="learn"><span aria-hidden="true">▤</span>배움</a>
      <a href="#journal" data-page="journal"><span aria-hidden="true">✎</span>내 기록</a>
      <a href="#book" data-page="book"><span aria-hidden="true">▥</span>내 책</a>
    </nav>
    <div class="sidebar-note"><span class="sprout" aria-hidden="true">❧</span><p>조금 느리게 걸어도,<br>이야기는 쌓이고 있어요.</p><span>오늘의 한 페이지를 만나보세요.</span></div>
    <div class="local-note">로그인 없이 시작하는 나의 공간</div>
  </aside>
  <div class="workspace">
    <header class="topbar"><p id="header-label">오늘의 제주, 오늘의 나</p><div><span class="date" id="today-date"></span><button class="outline small" id="top-write">＋ 기록 남기기</button></div></header>
    <main id="main" tabindex="-1"><div class="loading">첫 페이지를 펼치고 있어요…</div></main>
    <footer>제주 한 권 <span>걷고, 배우고, 쓰는 나의 사계절</span><button id="data-info">데이터 안내</button></footer>
  </div>
  <dialog id="detail-dialog"><button class="dialog-close" aria-label="팝업 닫기">×</button><div id="dialog-content"></div></dialog>
  <dialog id="write-dialog">
    <button class="dialog-close" aria-label="작성 창 닫기">×</button>
    <p class="eyebrow">MY LITTLE STORY</p><h2>오늘을 한 페이지로</h2><p class="muted">완벽한 문장이 아니어도 괜찮아요.</p>
    <form id="entry-form"><label>기록 종류<select name="type"><option>일상</option><option>산책</option><option>독서</option><option>배움</option></select></label><label>제목<input name="title" maxlength="100" required placeholder="오늘을 기억할 이름"></label><label>나의 이야기<textarea name="body" rows="7" maxlength="20000" required placeholder="오늘 발견한 작은 것부터 적어보세요."></textarea></label><p class="storage-note">이 브라우저에만 저장됩니다. 공용 기기에서는 주의해 주세요.</p><p id="save-error" role="alert"></p><button class="primary" type="submit">기록 저장하기</button></form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body></html>
